        <script>
            //date and time update on the footer//
            function updateDateTime(){
                const now = new Date();
                const options = {
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric",
                    hour:"2-digit",
                    minutes:"2-digits",
                    second:"2-digit"
                };
                document.getElementById("datetime").textContent = now.toLocaleDateString("en-US", options);
            }
            //update date time immedietely//
            updateDateTime();
            setInterval(updateDateTime, 1000);
